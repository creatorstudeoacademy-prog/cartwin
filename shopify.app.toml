# Cart Recovery Popup — Shopify app configuration
# Values with TODO must be filled after creating the app in Partner Dashboard.

client_id = "8285b8fd5b27409d57364414be7a9d0c"
name = "CartWin"
handle = "cartwin"
application_url = "https://cartwin-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "lumen-demo-rz4icdzs.myshopify.com"

[auth]
redirect_urls = ["https://cartwin-production.up.railway.app/auth/callback"]

[webhooks]
api_version = "2026-01"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

# MANDATORY GDPR compliance webhooks — app review auto-rejects without these
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[access_scopes]
# Minimal scopes: only what the app needs
scopes = "write_discounts,read_discounts"

[app_proxy]
url = "/tools"
prefix = "tools"
subpath = "cart-recovery"

[pos]
embedded = false

[privacy_compliance]
customer_data_request_url = "https://cartwin-production.up.railway.app/webhooks/compliance"
customer_deletion_url = "https://cartwin-production.up.railway.app/webhooks/compliance"
shop_deletion_url = "https://cartwin-production.up.railway.app/webhooks/compliance"
